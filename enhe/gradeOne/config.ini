;==================== 习题配置区 ====================
[exercise]
; 算式最大数字范围，例如20代表20以内加减法
max_number = 20

; 每行显示多少列，A4竖版建议：3‑5，不要大于6，避免文字挤出页面
columns = 5

; 每列纵向多少道题目，总题数 = columns × per_column_question
per_column_question = 10

; 是否只生成加法题 True/False
only_add = False

; 是否只生成减法题 True/False
only_sub = False

; 减法是否不允许出现负数，True：被减数 >= 减数
sub_no_negative = True

; 是否生成参考答案 True输出答案；False只输出空白试卷
enable_answer = True

;==================== 字体配置区 ====================
[font]
; 使用的中文字体，Windows一般用宋体，mac用“宋体‑简”
font_name = 宋体

; 标题字号（数学练习题、参考答案）
title_font_size = 18

; 习题内容字号
content_font_size = 12

;==================== 输出文件配置 ====================
[output]
; 生成的docx文件名，直接写文件名，和py脚本放在同一文件夹
file_name = 20以内加减法练习题.docx
